[project]
name = "agy-mcp"
version = "0.1.0"
description = "MCP server for Antigravity CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.21.2",
]

[project.scripts]
agy-mcp = "agy_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_mcp"]
